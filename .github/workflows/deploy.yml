name: deploy

# Deploys mario0318-site to Cloud Run whenever main changes.
# Auth is keyless (Workload Identity Federation): GitHub mints a short-lived
# OIDC token, Google swaps it for a ~10 min credential scoped to the
# github-deployer service account. No key files exist anywhere.
#
# The 2 values below came from scripts/setup-github-deploy.ps1. Neither is a
# secret: the provider only accepts tokens from mario0318/mario0318 on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_WIF_PROVIDER: projects/242365228416/locations/global/workloadIdentityPools/github/providers/mario0318-repo
  GCP_DEPLOY_SA: github-deployer@r3-m318.iam.gserviceaccount.com

concurrency:
  group: deploy-mario0318-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: terminal tests
        run: node test-terminal.mjs

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      # Flags mirror scripts/deploy-sungolog.ps1 (512Mi, concurrency 4, 300s) so
      # no deploy path shrinks the archive's memory headroom. Env vars are kept
      # as-is (no --set-env-vars). --allow-unauthenticated is omitted on purpose:
      # the service is already public and the deployer can't change IAM policy.
      #
      # Production traffic may be pinned to a specific revision (deploy-sungolog
      # does that), so a plain deploy would never go live. Instead: deploy with
      # no traffic under a tag, health-check that exact revision, then promote.
      - name: deploy candidate (no traffic)
        run: gcloud run deploy mario0318-site --source . --region us-central1 --project r3-m318 --platform managed --memory 512Mi --min-instances 0 --max-instances 1 --concurrency 4 --timeout 300 --no-cpu-boost --no-traffic --tag ci --quiet

      - name: health check candidate
        run: |
          url=$(gcloud run services describe mario0318-site --region us-central1 --project r3-m318 --format=json | jq -r '.status.traffic[] | select(.tag=="ci") | .url')
          echo "candidate: $url"
          test -n "$url"
          for path in / /sungolog/ /api/sungolog/status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          curl -s "$url/api/sungolog/status" | jq -e '.configured == true' > /dev/null

      - name: promote to 100% traffic
        run: gcloud run services update-traffic mario0318-site --region us-central1 --project r3-m318 --to-latest --quiet

      - name: smoke check production
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mario0318.com/)
          echo "mario0318.com -> $code"
          test "$code" = "200"
