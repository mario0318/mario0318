<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0d">
  <style>html,body{background:#0a0b0d;color:#f3f6ff}</style>
  <meta name="description" content="mario0318 terminal">
  <title>mario0318 terminal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/terminal.css">
</head>
<body>
  <nav id="fallback-nav" aria-label="Site navigation">
    <a href="https://raul3.com">raul3</a>
    <a href="https://github.com/mario0318">github</a>
    <a href="https://dapp.cam">dapp.cam</a>
    <a href="https://sprime.io">sprime.io</a>
    <a href="mailto:hi@mario0318.com">contact</a>
  </nav>

  <main id="term" class="term" hidden>
    <header class="term-head">
      <div class="term-id" aria-label="mario0318 web terminal">
        <a class="term-logo" href="/" aria-label="mario0318 home">
          <span class="dots idle" role="img" aria-label="terminal ready">
            <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
          </span>
          <span class="term-session">mario0318@web</span>
        </a>
      </div>
      <nav class="term-channels" aria-label="mario0318 channels">
        <button id="raul3-channel" class="channel channel-raul3" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="portal" aria-label="open raul3.com links">
          <span class="channel-dot" aria-hidden="true"></span><span class="channel-label" data-short="raul3.com" aria-hidden="true">raul3.com</span><span class="channel-caret" aria-hidden="true">+</span>
        </button>
      </nav>
    </header>
    <div id="out" class="term-out" role="log" aria-live="polite" aria-atomic="false"></div>
    <form id="prompt" class="term-prompt">
      <span class="ps1" aria-hidden="true"><span class="ps1-user">guest</span><span class="ps1-at">@</span><span class="ps1-host">m318</span><span class="ps1-path">:~</span><span class="ps1-char">$</span></span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" aria-label="terminal command input"
             placeholder="type help, then press Enter">
    </form>
  </main>

  <dialog id="portal" class="portal" aria-labelledby="portal-title">
    <button class="portal-close" type="button" aria-label="close">x</button>
    <h2 id="portal-title"></h2>
    <div id="portal-body"></div>
  </dialog>

  <section id="panel" class="panel" hidden aria-label="applet panel">
    <header class="panel-head">
      <span class="panel-title"></span>
      <button class="panel-close" type="button" aria-label="close">x</button>
    </header>
    <div id="panel-mount"></div>
  </section>

  <script type="module" src="/terminal.js"></script>
</body>
</html>
