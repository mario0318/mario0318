<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c0f">
  <style>html,body{background:#0a0c0f;color:#ced2d8}#fallback-nav{display:none}</style>
  <meta name="description" content="mario0318 terminal">
  <link rel="canonical" href="https://mario0318.com/">
  <title>mario0318 terminal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/terminal.css?v=4">
</head>
<body class="terminal-booting">
  <noscript><style>body::before{display:none!important}#fallback-nav{display:flex!important}</style></noscript>
  <nav id="fallback-nav" aria-label="Site navigation">
    <a href="https://raul3.com">raul3</a>
    <a href="https://github.com/mario0318">github</a>
    <a href="https://dapp.cam">dapp.cam</a>
    <a href="https://sprime.io">sprime.io</a>
    <a href="mailto:hi@mario0318.com">contact</a>
  </nav>

  <main id="term" class="term" hidden>
    <header class="term-head">
      <div class="term-id" aria-label="mario0318 web terminal">
        <span class="dots idle" role="group" aria-label="terminal themes">
          <button class="dot-button" type="button" data-theme="blue" aria-label="Blue futuristic terminal" aria-pressed="false"><span class="dot d1"></span></button><button class="dot-button" type="button" data-theme="green" aria-label="Green retro terminal" aria-pressed="false"><span class="dot d2"></span></button><button class="dot-button" type="button" data-theme="gray" aria-label="Grey default terminal" aria-pressed="true"><span class="dot d3"></span></button>
        </span>
        <a class="term-logo" href="/" aria-label="mario0318 home">
          <span class="term-session">mario0318@web</span>
        </a>
      </div>
      <nav class="term-channels" aria-label="mario0318 channels">
        <a class="raul3-logo-link" href="https://raul3.com" aria-label="R3 Labs on raul3.com"><img class="raul3-logo" src="https://raul3.com/assets/brand/r3-logo.png?v=20260708-nobox" alt="R3labs"></a>
        <a class="r3labs-retro-link" href="https://raul3.com">R3LABS</a>
      </nav>
    </header>
    <div id="out" class="term-out" role="log" aria-live="polite" aria-atomic="false"></div>
    <form id="prompt" class="term-prompt">
      <span class="ps1" aria-hidden="true"><span class="ps1-user">user</span><span class="ps1-at">@</span><span class="ps1-host">[unknown]</span><span class="ps1-path">:~</span><span class="ps1-char">$</span></span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" aria-label="terminal command input"
             placeholder="type help, then press Enter">
    </form>
  </main>

  <dialog id="portal" class="portal" aria-labelledby="portal-title">
    <button class="portal-close" type="button" aria-label="close">×</button>
    <h2 id="portal-title"></h2>
    <div id="portal-body"></div>
  </dialog>

  <section id="panel" class="panel" hidden aria-label="applet panel">
    <header class="panel-head">
      <span class="panel-title"></span>
      <button class="panel-close" type="button" aria-label="close">x</button>
    </header>
    <div id="panel-mount"></div>
  </section>

  <script type="module" src="/terminal.js"></script>
</body>
</html>
