<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="description" content="mario0318 terminal">
  <title>mario0318 terminal</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/terminal.css">
</head>
<body>
  <nav id="fallback-nav" aria-label="Site navigation">
    <a href="https://raul3.com">raul3</a>
    <a href="https://github.com/mario0318">github</a>
    <a href="https://dapp.cam">dapp.cam</a>
    <a href="https://sprime.io">sprime.io</a>
    <a href="mailto:hi@mario0318.com">contact</a>
  </nav>

  <main id="term" class="term" hidden>
    <header class="term-head">
      <div class="dots idle" role="img" aria-label="status indicator">
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      </div>
    </header>
    <div id="out" class="term-out" role="log" aria-live="polite" aria-atomic="false"></div>
    <div id="chips" class="chips" role="listbox" aria-label="command suggestions"></div>
    <form id="prompt" class="term-prompt">
      <span class="ps1" aria-hidden="true">~</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="go" aria-label="terminal command input"
             placeholder="type something. or don't.">
    </form>
  </main>

  <dialog id="portal" class="portal" aria-labelledby="portal-title">
    <button class="portal-close" type="button" aria-label="close">x</button>
    <h2 id="portal-title"></h2>
    <div id="portal-body"></div>
  </dialog>

  <section id="panel" class="panel" hidden aria-label="applet panel">
    <header class="panel-head">
      <span class="panel-title"></span>
      <button class="panel-close" type="button" aria-label="close">x</button>
    </header>
    <div id="panel-mount"></div>
  </section>

  <script type="module" src="/terminal.js"></script>
</body>
</html>
