<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<title>mario0318</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0c10;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
canvas { display: block; position: fixed; inset: 0; cursor: default; }
#legend {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(78vmin, 560px);
  height: min(78vmin, 560px);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.legend-label {
  position: absolute;
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
  font-size: clamp(0.58rem, 1.4vw, 0.8rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.34);
  transform: translate(-50%, -50%);
  transition: color 160ms ease, opacity 160ms ease, transform 160ms ease;
  white-space: nowrap;
}
.legend-label.active {
  color: rgba(255,255,255,0.86);
  transform: translate(-50%, -50%) scale(1.04);
}
#ts {
  position: fixed;
  bottom: max(1.75rem, env(safe-area-inset-bottom, 1.75rem));
  left: 50%;
  transform: translateX(-50%);
  font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
  font-size: clamp(0.55rem, 1.4vw, 0.72rem);
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.12em;
  pointer-events: none;
  white-space: nowrap;
}
.anchor-hotspot {
  position: fixed;
  z-index: 4;
  width: 120px;
  height: 64px;
  transform: translate(-50%, -50%);
  border: 0;
  background: transparent;
  color: rgba(255,255,255,0.4);
  font: 0.68rem ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
}
.anchor-hotspot::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid transparent;
  background: transparent;
  transition: border-color 160ms ease, background 160ms ease;
}
.anchor-hotspot:focus-visible {
  outline: 1px solid rgba(255,255,255,0.8);
  outline-offset: 6px;
}
.anchor-hotspot:hover::before,
.anchor-hotspot:focus-visible::before,
.anchor-hotspot.active::before {
  border-color: color-mix(in srgb, var(--anchor-color) 65%, transparent);
  background: color-mix(in srgb, var(--anchor-color) 10%, transparent);
}
.cluster-menu {
  position: fixed;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.42rem;
  width: min(280px, 82vw);
  transform: translate(-50%, -50%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.cluster-menu.active {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.cluster-menu a {
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 0 0.7rem;
  border: 1px solid color-mix(in srgb, var(--menu-color) 34%, transparent);
  background: rgba(10,12,16,0.74);
  color: rgba(255,255,255,0.86);
  text-decoration: none;
  font: 0.66rem ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(10px);
}
.cluster-menu a:hover,
.cluster-menu a:focus-visible {
  color: #fff;
  border-color: var(--menu-color);
  outline: none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="legend" aria-hidden="true">
  <div class="legend-label" id="legend-blue">mario0318</div>
  <div class="legend-label" id="legend-green">raul3</div>
  <div class="legend-label" id="legend-gray">reach</div>
</div>
<button class="anchor-hotspot" id="hotspot-blue" style="--anchor-color:#4db8ff" type="button" aria-label="Show mario0318 links"></button>
<button class="anchor-hotspot" id="hotspot-green" style="--anchor-color:#55e09a" type="button" aria-label="Show raul3 links"></button>
<button class="anchor-hotspot" id="hotspot-gray" style="--anchor-color:#9ab4c6" type="button" aria-label="Show reach links"></button>
<nav class="cluster-menu" id="menu-blue" style="--menu-color:#4db8ff" aria-label="mario0318 links">

<div id="ts"></div>
<script>
// ── WORLD DATA ───────────────────────────────────────────────────────────────
const WORLDS = [
  {
    id: 'blue', color: '#4db8ff',
    baseAngle: (4 * Math.PI) / 3,
    label: 'mario0318',
    nodes: [
      { label: 'Watch',  color: '#4db8ff', isGroup: true,
        children: [
          { label: 'YouTube',    href: 'https://www.youtube.com/@mario0318' },
          { label: 'TikTok',    href: 'https://tiktok.com/@mariozed318' }
        ]
      },
      { label: 'Listen', color: '#72caee', isGroup: true,
        children: [
          { label: 'SoundCloud', href: 'https://soundcloud.com/mario0318' }
        ]
      },
      { label: 'Social', color: '#7ab8f0', isGroup: true,
        children: [
          { label: 'Instagram', href: 'https://instagram.com/mario00318' },
          { label: 'X',         href: 'https://x.com/mario0318' },
          { label: 'Threads',   href: 'https://www.threads.net/@mario00318' },
          { label: 'Snapchat',  href: 'https://www.snapchat.com/add/mario00318' }
        ]
      },
      { label: 'Code',   color: '#5eaad8', isGroup: false,
        href: 'https://github.com/mario0318'
      }
    ]
  },
  {
    id: 'green', color: '#55e09a',
    baseAngle: (2 * Math.PI) / 3,
    label: 'raul3',
    nodes: [
      { label: 'sprime',    href: 'https://sprime.io',               color: '#55e09a' },
      { label: 'raul3',     href: 'https://raul3.com',               color: '#6ae8a8' },
      { label: 'dapp.cam',  href: 'https://dapp.cam',                color: '#7de8b4' },
      { label: 'fairchild', href: 'https://fairchildalchemy.com',    color: '#4dd68a' },
      { label: 'github',    href: 'https://github.com/mario0318',    color: '#3dcc7c' }
    ]
  },
  {
    id: 'gray', color: '#9ab4c6',
    baseAngle: 0,
    label: 'reach',
    nodes: [
      { label: 'email',    href: 'mailto:mario0318@gmail.com',                      color: '#9ab4c6' },
      { label: 'amazon',   href: 'https://www.amazon.com/shop/mario0318@gmail.com', color: '#aabec8' },
      { label: 'linktree', href: 'https://linktr.ee/mario0318',                     color: '#8aaec0' },
      { label: 'guest',    href: null, placeholder: true,                           color: '#6a94ac' },
      { label: 'tools',    href: null, placeholder: true,                           color: '#7aa4b8' }
    ]
  }
];

// ── CONSTANTS ────────────────────────────────────────────────────────────────
const BG             = '#0a0c10';
const BASE_RATE      = (2 * Math.PI) / 86400000;
const DECAY_HL       = 90000;
const THRESH_DRIFT   = 2;
const THRESH_CHARGED = 32;
const THRESH_PORTAL  = 512;
const MAX_MULT       = 131072;

// ── STATE ────────────────────────────────────────────────────────────────────
let angle         = 0;
let speedMult     = 1;
let lastTime      = null;
let lastDecay     = null;
let ripples       = [];
let orbitAngles   = WORLDS.map(() => Math.random() * Math.PI * 2);
let expandedGroup = null;
let hoverTarget   = null;
let activeWorldIdx = null;

// ── CANVAS ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const legend = {
  blue: document.getElementById('legend-blue'),
  green: document.getElementById('legend-green'),
  gray: document.getElementById('legend-gray')
};
const hotspots = {
  blue: document.getElementById('hotspot-blue'),
  green: document.getElementById('hotspot-green'),
  gray: document.getElementById('hotspot-gray')
};
const menus = {
  blue: document.getElementById('menu-blue'),
  green: document.getElementById('menu-green'),
  gray: document.getElementById('menu-gray')
};
let domHoverWorldIdx = null;
let W, H, cx, cy, TR, dotR;

function resize() {
  W  = canvas.width  = window.innerWidth;
  H  = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
  const m = Math.min(W, H);
  TR   = m * 0.11;
  dotR = W < 480 ? 6 : W < 1024 ? 8 : 10;
}
window.addEventListener('resize', resize);
resize();

// ── HELPERS ──────────────────────────────────────────────────────────────────
function getState() {
  if (speedMult < THRESH_DRIFT)   return 'still';
  if (speedMult < THRESH_CHARGED) return 'drift';
  if (speedMult < THRESH_PORTAL)  return 'charged';
  return 'portal';
}

function getCDR() {
  if (speedMult < THRESH_CHARGED) return dotR;
  const t = Math.min(1, (speedMult - THRESH_CHARGED) / (THRESH_PORTAL * 3 - THRESH_CHARGED));
  return dotR * (1 + 2.5 * t);
}

function getGlow() {
  if (speedMult < THRESH_CHARGED) return 0;
  return Math.min(1, (speedMult - THRESH_CHARGED) / (THRESH_PORTAL - THRESH_CHARGED));
}

function dotPos(world) {
  const a = world.baseAngle + angle;
  return { x: cx + Math.cos(a) * TR, y: cy + Math.sin(a) * TR };
}

function nodePos(wi, ni) {
  const world = WORLDS[wi];
  const cdr   = getCDR();
  const orR   = Math.max(55, cdr * 4.8);
  const nc    = world.nodes.length;
  const oa    = orbitAngles[wi] + (ni / nc) * Math.PI * 2;
  const dp    = dotPos(world);
  return { x: dp.x + Math.cos(oa) * orR, y: dp.y + Math.sin(oa) * orR };
}

function getRenderNodes(world) {
  const nodes = [];
  world.nodes.forEach((node) => {
    if (node.isGroup) {
      node.children.forEach((child) => {
        nodes.push({
          label: child.label,
          href: child.href,
          color: node.color || world.color,
          placeholder: false,
          groupChild: true
        });
      });
      return;
    }
    nodes.push(node);
  });
  return nodes;
}

function childPos(wi, ni, ci) {
  if (!expandedGroup || expandedGroup.worldIdx !== wi || expandedGroup.nodeIdx !== ni) return null;
  const np  = nodePos(wi, ni);
  const cdr = getCDR();
  const coa = expandedGroup.baseChildAngles[ci] + expandedGroup.orbitOffset;
  const cr  = Math.max(38, cdr * 3.2);
  return { x: np.x + Math.cos(coa) * cr, y: np.y + Math.sin(coa) * cr };
}

function d2(ax, ay, bx, by) {
  return Math.sqrt((bx - ax) ** 2 + (by - ay) ** 2);
}

function getHoverWorldIdx() {
  if (domHoverWorldIdx !== null) return domHoverWorldIdx;
  if (!hoverTarget) return null;
  return hoverTarget.worldIdx ?? null;
}

function getVisibleWorlds() {
  if (getState() === 'portal') return WORLDS.map((_, index) => index);
  const hoverWorldIdx = getHoverWorldIdx();
  if (hoverWorldIdx !== null) return [hoverWorldIdx];
  if (expandedGroup) return [expandedGroup.worldIdx];
  if (activeWorldIdx !== null) return [activeWorldIdx];
  return [];
}

function updateLegend() {
  WORLDS.forEach((world) => {
    const label = legend[world.id];
    if (!label) return;
    const p = dotPos(world);
    let dx = 0;
    let dy = 0;
    if (world.id === 'blue') dy = -28;
    if (world.id === 'green') { dx = -62; dy = 10; }
    if (world.id === 'gray') { dx = 62; dy = 10; }
    label.style.left = `${p.x + dx}px`;
    label.style.top = `${p.y + dy}px`;
    const active = getVisibleWorlds().includes(WORLDS.indexOf(world)) || hoverTarget?.worldIdx === WORLDS.indexOf(world) || domHoverWorldIdx === WORLDS.indexOf(world);
    label.classList.toggle('active', active);
  });
}

function setMenuOpen(worldId, isOpen) {
  hotspots[worldId]?.classList.toggle('active', isOpen);
  menus[worldId]?.classList.toggle('active', isOpen);
}

function positionDomOverlays() {
  WORLDS.forEach((world, wi) => {
    const hotspot = hotspots[world.id];
    const menu = menus[world.id];
    if (!hotspot || !menu) return;

    const p = dotPos(world);
    hotspot.style.left = `${p.x}px`;
    hotspot.style.top = `${p.y}px`;

    const menuYOffset = world.id === 'blue' ? -94 : 94;
    const menuXOffset = world.id === 'green' ? -56 : world.id === 'gray' ? 56 : 0;
    menu.style.left = `${p.x + menuXOffset}px`;
    menu.style.top = `${p.y + menuYOffset}px`;

    setMenuOpen(world.id, getVisibleWorlds().includes(wi) || domHoverWorldIdx === wi);
  });
}

// ── HIT TEST ─────────────────────────────────────────────────────────────────
function hitTest(px, py) {
  const cdr = getCDR();

  if (expandedGroup) {
    const { worldIdx: wi, nodeIdx: ni, children } = expandedGroup;
    for (let ci = 0; ci < children.length; ci++) {
      const cp = childPos(wi, ni, ci);
      if (cp && d2(px, py, cp.x, cp.y) < cdr * 1.1)
        return { type: 'child', worldIdx: wi, nodeIdx: ni, childIdx: ci };
    }
  }

  for (let wi = 0; wi < WORLDS.length; wi++) {
    const renderNodes = getRenderNodes(WORLDS[wi]);
    const nc = renderNodes.length;
    for (let ni = 0; ni < nc; ni++) {
      const np = nodePos(wi, ni);
      if (d2(px, py, np.x, np.y) < cdr * 1.15)
        return { type: 'node', worldIdx: wi, nodeIdx: ni };
    }
  }

  for (let wi = 0; wi < WORLDS.length; wi++) {
    const dp = dotPos(WORLDS[wi]);
    if (d2(px, py, dp.x, dp.y) < Math.max(cdr * 3.4, 26))
      return { type: 'dot', worldIdx: wi };
  }

  return null;
}

function handleHit(hit) {
  if (hit.type === 'child') {
    const child = expandedGroup?.children[hit.childIdx];
    if (child?.href) window.open(child.href, '_blank', 'noreferrer');
    return;
  }
  if (hit.type === 'node') {
    const node = getRenderNodes(WORLDS[hit.worldIdx])[hit.nodeIdx];
    if (node.placeholder) return;
    if (node.href) {
      window.open(node.href, '_blank', 'noreferrer');
    }
    return;
  }
  if (hit.type === 'dot' && hit.worldIdx === 1)
    window.open('https://raul3.com', '_blank', 'noreferrer');
}

// ── INPUT ────────────────────────────────────────────────────────────────────
function onPointerDown(e) {
  e.preventDefault();
  const px = e.clientX ?? e.touches?.[0]?.clientX;
  const py = e.clientY ?? e.touches?.[0]?.clientY;
  if (px == null) return;

  const hit = hitTest(px, py);
  if (hit) {
    if (hit.type === 'dot') {
      activeWorldIdx = activeWorldIdx === hit.worldIdx ? null : hit.worldIdx;
      expandedGroup = null;
      ripples.push({ x: px, y: py, r: 0, alpha: 0.5 });
      return;
    }
    handleHit(hit);
    ripples.push({ x: px, y: py, r: 0, alpha: 0.5 });
    return;
  }

  speedMult = Math.min(speedMult * 2, MAX_MULT);
  lastDecay = performance.now();
  ripples.push({ x: px, y: py, r: 0, alpha: 0.55 });
}

function onMouseMove(e) {
  hoverTarget = hitTest(e.clientX, e.clientY);
  canvas.style.cursor = hoverTarget ? 'pointer' : 'default';
}

function onPointerLeave() {
  hoverTarget = null;
  canvas.style.cursor = 'default';
}

canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('mousemove',   onMouseMove);
canvas.addEventListener('mouseleave',  onPointerLeave);

WORLDS.forEach((world, wi) => {
  const hotspot = hotspots[world.id];
  const menu = menus[world.id];
  const open = () => {
    domHoverWorldIdx = wi;
    activeWorldIdx = wi;
    expandedGroup = null;
  };
  const close = () => {
    window.setTimeout(() => {
      const activeEl = document.activeElement;
      if (hotspot?.matches(':hover') || menu?.matches(':hover') || hotspot === activeEl || menu?.contains(activeEl)) return;
      if (domHoverWorldIdx === wi) domHoverWorldIdx = null;
    }, 0);
  };

  [hotspot, menu].forEach((el) => {
    if (!el) return;
    el.addEventListener('mouseenter', open);
    el.addEventListener('focusin', open);
    el.addEventListener('mouseleave', close);
    el.addEventListener('focusout', close);
  });

  hotspot?.addEventListener('click', () => {
    const isOpen = activeWorldIdx === wi && domHoverWorldIdx === wi;
    activeWorldIdx = isOpen ? null : wi;
    domHoverWorldIdx = isOpen ? null : wi;
  });
});

// ── DRAW ─────────────────────────────────────────────────────────────────────
function drawBG(gi) {
  const alpha = gi > 0 ? Math.max(0.07, 1 - gi * 0.93) : 1;
  ctx.globalAlpha = alpha;
  ctx.fillStyle   = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

function drawRipples() {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r    += 1.8 + r.r * 0.04;
    r.alpha *= 0.91;
    if (r.alpha < 0.01) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${r.alpha * 0.25})`;
    ctx.lineWidth   = 0.8;
    ctx.stroke();
  }
}

function drawFormation(gi) {
  if (gi < 0.2) return;
  const a = ((gi - 0.2) / 0.8) * 0.12;
  ctx.beginPath();
  WORLDS.forEach((w, i) => {
    const p = dotPos(w);
    i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
  });
  ctx.closePath();
  ctx.strokeStyle = `rgba(255,255,255,${a})`;
  ctx.lineWidth   = 0.4;
  ctx.stroke();
}

function drawOrbiters(cdr) {
  const visibleWorlds = getVisibleWorlds();
  if (!visibleWorlds.length) return;
  const orR   = Math.max(55, cdr * 4.8);
  const nodeR = Math.max(5, cdr * 0.75);

  WORLDS.forEach((world, wi) => {
    if (!visibleWorlds.includes(wi)) return;
    const dp = dotPos(world);

    // Ring
    ctx.beginPath();
    ctx.arc(dp.x, dp.y, orR, 0, Math.PI * 2);
    ctx.strokeStyle = `${world.color}36`;
    ctx.lineWidth   = 0.8;
    ctx.stroke();

    const renderNodes = getRenderNodes(world);
    renderNodes.forEach((node, ni) => {
      const np      = nodePos(wi, ni);
      const isHov   = hoverTarget?.type === 'node' && hoverTarget.worldIdx === wi && hoverTarget.nodeIdx === ni;
      const isPH    = node.placeholder;
      const isExp   = false;
      const nc      = node.color || world.color;

      // Spoke
      ctx.beginPath(); ctx.moveTo(dp.x, dp.y); ctx.lineTo(np.x, np.y);
      ctx.strokeStyle = `${world.color}28`; ctx.lineWidth = 0.6; ctx.stroke();

      // Node
      ctx.beginPath();
      ctx.arc(np.x, np.y, nodeR, 0, Math.PI * 2);
      ctx.fillStyle = isPH ? `${nc}38` : (isHov || isExp) ? nc : `${nc}cc`;
      if (isHov && !isPH) { ctx.shadowBlur = 10; ctx.shadowColor = nc; }
      ctx.fill(); ctx.shadowBlur = 0;

      // Label
      ctx.font         = `${Math.max(7, nodeR * 0.75)}px ui-monospace,monospace`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle    = isPH ? 'rgba(255,255,255,0.18)'
                       : isHov ? 'rgba(255,255,255,0.95)'
                       : 'rgba(255,255,255,0.82)';
      ctx.fillText(node.label, np.x, np.y + nodeR + 3);
    });
  });
}

function drawDots(cdr, gi) {
  const visibleWorlds = getVisibleWorlds();
  const isPortal = getState() === 'portal';
  WORLDS.forEach((world, wi) => {
    const p = dotPos(world);
    const active = visibleWorlds.includes(wi) || hoverTarget?.worldIdx === wi;
    if (gi > 0) { ctx.shadowBlur = 6 + gi * 28; ctx.shadowColor = world.color; }
    ctx.beginPath(); ctx.arc(p.x, p.y, active ? cdr * 1.18 : cdr, 0, Math.PI * 2);
    ctx.fillStyle = world.color; ctx.fill();
    ctx.shadowBlur = 0;
    if (isPortal || active) {
      ctx.beginPath(); ctx.arc(p.x, p.y, cdr * 1.65, 0, Math.PI * 2);
      ctx.strokeStyle = `${world.color}66`; ctx.lineWidth = 1.2; ctx.stroke();
    }
  });
}

// ── TIMESTAMP ────────────────────────────────────────────────────────────────
const tsEl = document.getElementById('ts');
function updateTS() {
  const n  = new Date();
  const H  = n.getHours();
  const mm = String(n.getMinutes()).padStart(2, '0');
  const yy = String(n.getFullYear()).slice(-2);
  const M  = n.getMonth() + 1;
  const dd = String(n.getDate()).padStart(2, '0');
  tsEl.textContent = `${H}:${mm} | ${yy}:${M}${dd}`;
}
setInterval(updateTS, 1000);
updateTS();

// ── LOOP ─────────────────────────────────────────────────────────────────────
function loop(now) {
  if (!lastTime)  lastTime  = now;
  if (!lastDecay) lastDecay = now;
  const dt = Math.min(now - lastTime, 100);
  lastTime = now;

  if (speedMult > 1) {
    speedMult = Math.max(1, speedMult * Math.pow(0.5, (now - lastDecay) / DECAY_HL));
    lastDecay = now;
  }

  angle += BASE_RATE * speedMult * dt;

  const visibleWorlds = getVisibleWorlds();
  orbitAngles = orbitAngles.map((a, wi) => {
    const orbitRate = visibleWorlds.includes(wi) ? (2 * Math.PI) / 12000 : BASE_RATE * 4;
    return a + orbitRate * dt;
  });

  if (expandedGroup) expandedGroup.orbitOffset += ((2 * Math.PI) / 9000) * dt;

  const cdr = getCDR();
  const gi  = getGlow();

  drawBG(gi);
  drawRipples();
  drawFormation(gi);
  drawOrbiters(cdr);
  drawDots(cdr, gi);
  updateLegend();
  positionDomOverlays();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
