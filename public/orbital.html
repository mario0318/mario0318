<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="mario0318 orbital interface">
  <meta property="og:title" content="mario0318 orbital interface">
  <meta property="og:description" content="A three-dot orbital gate for identity, builds, and worlds.">
  <title>mario0318</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/orbit.css">
</head>
<body>
  <a class="skip-link" href="#links">Skip to links</a>

  <main class="orbital-shell">
    <section class="orbital-stage" aria-label="mario0318 orbital interface">
      <canvas id="atmosphere" class="atmosphere" aria-hidden="true"></canvas>

      <div id="orbital-camera" class="orbital-camera">
        <div id="top-cluster" class="top-cluster" aria-label="primary orbit nodes"></div>
        <div id="child-orbit-layer" class="child-orbit-layer" aria-live="polite"></div>
      </div>

      <aside class="orbital-hud" aria-live="polite">
        <p class="eyebrow">mario0318</p>
        <h1 id="status-title">select an orb</h1>
        <p id="status-copy">the dots are the interface</p>
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="orbital path"></nav>
        <button id="back-button" class="back-button" type="button" hidden>Back</button>
      </aside>
    </section>

    <section id="links" class="fallback-links" aria-label="links">
      <h2>Links</h2>
      <div id="fallback-list"></div>
    </section>
  </main>

  <a class="terminal-return" href="/" aria-label="Return to terminal">terminal</a>

  <noscript>
    <section class="noscript-links" aria-label="links">
      <h2>Links</h2>
      <ul>
        <li><a href="https://raul3.com">raul3</a></li>
        <li><a href="https://github.com/mario0318">GitHub</a></li>
        <li><a href="mailto:hi@mario0318.com">Contact</a></li>
        <li><a href="https://dapp.cam">dapp.cam</a></li>
        <li><a href="https://fairchildalchemy.com">Fairchild Alchemy</a></li>
        <li><a href="https://sprime.io">sprime.io</a></li>
        <li><a href="https://sprime.us">sprime.us</a></li>
      </ul>
    </section>
  </noscript>

  <script type="module" src="/orbit.js"></script>
</body>
</html>
